[project]
name = "ugrp"
version = "0.1.0"
description = "수능 국어 비문학 지문 생성 에이전트 - Gemma 4 31B-it think mode QLoRA 파이프라인"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
